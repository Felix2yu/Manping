name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  portable-core:
    # AppKit, Metal, mpv and the full macOS suite require build-and-test below.
    runs-on: ubuntu-latest
    container: swift:6.4@sha256:e0f67c4120502628d4ced5058df25d334332e21501ae1a0797fd0c0a96486e79
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test runner
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
      - name: Portable Swift core tests (Release, offline)
        run: python3 scripts/portable_core_check.py
  build-and-test:
    runs-on: macos-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest installed Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Swift tests (Core and App; offline fixtures only)
        run: swift test
      - name: Script tests
        run: |
          python3 scripts/diagnostic_checks_test.py
          python3 scripts/live_check_test.py
